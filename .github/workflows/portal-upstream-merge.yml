# Monthly merge of sunflower-land/sunflower-land `main` into the portal branch.
#
# - Conflicts in src/lib/i18n/dictionaries/*.json are resolved key by key
#   (both sides' additions are kept; if both changed the same key, upstream wins).
# - Clean merge + passing `yarn tsc` -> pushed straight to the portal branch,
#   which triggers "Portal deploy".
# - Any other conflict, or a `yarn tsc` failure -> the merge commit is pushed to
#   an `upstream-merge/*` branch and a PR is opened against the portal branch.
#   Merge that PR with a MERGE COMMIT, not squash: squashing drops the link to
#   upstream/main and next month's merge would re-conflict on the same files.
#
# Requires the repo secret PORTAL_MERGE_TOKEN: a fine-grained PAT scoped to this
# repo with Contents, Workflows and Pull requests set to read/write. The default
# GITHUB_TOKEN can't push commits that touch .github/workflows/, and pushes made
# with it don't trigger other workflows (so Portal deploy wouldn't run).
#
# Run it by hand from the Actions tab via "Run workflow".
name: Portal upstream merge

on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of every month
  workflow_dispatch:

concurrency:
  group: portal-upstream-merge

env:
  TARGET_BRANCH: portal/crops-and-chickens
  UPSTREAM_URL: https://github.com/sunflower-land/sunflower-land.git

jobs:
  merge:
    if: github.repository == 'Polysemouse/sunflower-land'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout portal branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.PORTAL_MERGE_TOKEN }}

      - name: Merge upstream main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream/main."
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git merge --no-ff --no-edit upstream/main
          merge_exit=$?
          set -e

          if ! git rev-parse -q --verify MERGE_HEAD > /dev/null; then
            if [ "$merge_exit" -ne 0 ]; then
              echo "git merge failed without leaving a merge in progress."
              exit 1
            fi
            echo "status=merged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve i18n dictionary conflicts with a key-level 3-way merge.
          git diff --name-only --diff-filter=U \
            | grep -E '^src/lib/i18n/dictionaries/[^/]+\.json$' \
            > "$RUNNER_TEMP/i18n-conflicts.txt" || true

          python3 - "$RUNNER_TEMP/i18n-conflicts.txt" "$RUNNER_TEMP/i18n-resolved.txt" <<'EOF'
          import json, subprocess, sys

          def stage(n, path):
              try:
                  out = subprocess.check_output(
                      ["git", "show", f":{n}:{path}"], stderr=subprocess.DEVNULL
                  )
              except subprocess.CalledProcessError:
                  return None
              return out.decode()

          paths = [p for p in open(sys.argv[1]).read().split("\n") if p]
          resolved = []
          for path in paths:
              base_raw, ours_raw, theirs_raw = (stage(n, path) for n in (1, 2, 3))
              if ours_raw is None or theirs_raw is None:
                  continue  # deleted on one side: leave for a human
              base = json.loads(base_raw) if base_raw else {}
              ours, theirs = json.loads(ours_raw), json.loads(theirs_raw)
              out = {}
              # Upstream's key order, applying our edits where upstream didn't edit.
              for k, v in theirs.items():
                  if k in ours:
                      out[k] = ours[k] if v == base.get(k) else v
                  elif k not in base:
                      out[k] = v  # added upstream
                  # else: we deleted it and upstream didn't add it back
              # Keys only we added go at the end.
              for k, v in ours.items():
                  if k not in theirs and k not in base:
                      out[k] = v
              with open(path, "w") as f:
                  f.write(json.dumps(out, indent=2, ensure_ascii=False))
                  if theirs_raw.endswith("\n"):
                      f.write("\n")
              subprocess.check_call(["git", "add", path])
              resolved.append(path)

          with open(sys.argv[2], "w") as f:
              f.write("".join(p + "\n" for p in resolved))
          print(f"Auto-resolved {len(resolved)} i18n file(s).")
          EOF

          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"

          if [ -s "$RUNNER_TEMP/conflicts.txt" ]; then
            echo "Unresolved conflicts:"
            cat "$RUNNER_TEMP/conflicts.txt"
            # Commit the markers so the PR branch holds the real merge.
            git add -A
            git commit --no-edit
            echo "status=conflicts" >> "$GITHUB_OUTPUT"
          else
            git commit --no-edit
            echo "status=merged" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.merge.outputs.status == 'merged'
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: yarn

      - name: Install modules
        if: steps.merge.outputs.status == 'merged'
        run: yarn install --frozen-lockfile

      - name: Type-check
        id: tsc
        if: steps.merge.outputs.status == 'merged'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set +e
          yarn tsc > "$RUNNER_TEMP/tsc.log" 2>&1
          tsc_exit=$?
          set -e
          cat "$RUNNER_TEMP/tsc.log"
          if [ "$tsc_exit" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to portal branch
        if: steps.merge.outputs.status == 'merged' && steps.tsc.outputs.ok == 'true'
        run: git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Open PR for manual fixes
        if: >-
          steps.merge.outputs.status == 'conflicts' ||
          (steps.merge.outputs.status == 'merged' && steps.tsc.outputs.ok == 'false')
        env:
          GH_TOKEN: ${{ secrets.PORTAL_MERGE_TOKEN }}
          STATUS: ${{ steps.merge.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="upstream-merge/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"

          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Monthly merge of \`upstream/main\` into \`$TARGET_BRANCH\` needs manual fixes."
            echo
            if [ "$STATUS" = "conflicts" ]; then
              title="[Upstream merge] Resolve conflicts ($(date -u +%Y-%m))"
              draft="--draft"
              echo "These files were committed **with conflict markers** and need resolving on this branch:"
              echo
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt"
            else
              title="[Upstream merge] Fix type errors ($(date -u +%Y-%m))"
              draft=""
              echo "The merge was clean but \`yarn tsc\` failed:"
              echo
              echo '```'
              grep 'error TS' "$RUNNER_TEMP/tsc.log" | head -100
              echo '```'
            fi
            if [ -s "$RUNNER_TEMP/i18n-resolved.txt" ]; then
              echo
              echo "i18n dictionaries auto-resolved key by key:"
              echo
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/i18n-resolved.txt"
            fi
            echo
            echo "Fix on this branch, then **merge with a merge commit (not squash)** so the next monthly merge doesn't re-conflict."
            echo
            echo "Workflow run: $RUN_URL"
          } > "$body"

          gh pr create $draft \
            --base "$TARGET_BRANCH" \
            --head "$branch" \
            --title "$title" \
            --body-file "$body"
